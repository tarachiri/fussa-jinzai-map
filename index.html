<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="福生市で活動する市民団体を地図から見つける人材資源マップ">
  <title>福生市 人材資源マップ</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">FUSSA COMMUNITY MAP</p>
      <h1>福生市 人材資源マップ</h1>
      <p class="subtitle">地域で活動する団体を、地図から見つける試作版です。</p>
    </div>
    <div class="count-card" aria-live="polite">
      <span id="visible-count">–</span>
      <small>地図掲載団体</small>
    </div>
  </header>

  <main>
    <section class="legend" aria-label="地図の凡例">
      <span><i class="legend-dot verified"></i>位置確認済み</span>
      <span><i class="legend-dot unverified"></i>概算・未確認</span>
      <span id="data-summary">データ読込中…</span>
    </section>
    <div id="map" role="application" aria-label="福生市人材資源マップ"></div>
    <div id="load-error" class="error-panel" hidden>
      データを読み込めませんでした。時間をおいて再度お試しください。
    </div>
  </main>

  <footer>
    <p>位置情報が概算・未確認の団体があります。訪問前に公式情報をご確認ください。</p>
    <p>電話番号・メール・代表者名は、公開確認が取れていないため掲載していません。</p>
    <p>地図 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
